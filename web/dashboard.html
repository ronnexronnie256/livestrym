<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestrym — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;display:flex}
a{color:#4d9de0;text-decoration:none}

/* Sidebar */
.sidebar{width:220px;background:#111827;border-right:1px solid #1f2937;position:fixed;height:100vh;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{padding:20px 18px;border-bottom:1px solid #1f2937;display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:#2f7cf6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text h2{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:white}
.logo-text span{font-size:10px;color:#6b7280}
.user-box{padding:14px 18px;border-bottom:1px solid #1f2937}
.user-avatar{width:34px;height:34px;border-radius:50%;background:#0f1f3d;border:2px solid #2f7cf6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#4d9de0;float:left;margin-right:10px}
.user-name{font-size:13px;font-weight:600;color:white;padding-top:2px}
.user-tier{font-size:10px;background:#0f1f3d;color:#4d9de0;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px;font-weight:600}
.sidebar-nav{flex:1;padding:10px 0}
.nav-item{display:flex;align-items:center;padding:10px 18px;color:#9ca3af;font-size:13px;gap:10px;border-left:3px solid transparent;cursor:pointer;text-decoration:none}
.nav-item:hover,.nav-item.active{background:#1f2937;color:white;border-left-color:#2f7cf6}
.nav-icon{font-size:15px;width:20px;text-align:center}
.sidebar-footer{padding:14px 18px;border-top:1px solid #1f2937}

/* Main */
.main{margin-left:220px;flex:1;min-height:100vh}
.topbar{background:#111827;border-bottom:1px solid #1f2937;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:700;color:white;font-family:'Sora',sans-serif}
.content{padding:24px}
.page-title{font-size:18px;font-weight:700;color:white;font-family:'Sora',sans-serif;margin-bottom:4px}
.page-sub{font-size:13px;color:#6b7280;margin-bottom:22px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:18px}
.stat-icon{font-size:22px;margin-bottom:8px}
.stat-num{font-size:26px;font-weight:700;color:white;font-family:'Sora',sans-serif}
.stat-label{font-size:11px;color:#6b7280;margin-top:3px;text-transform:uppercase;letter-spacing:.4px}

/* Card */
.card{background:#111827;border:1px solid #1f2937;border-radius:10px;overflow:hidden;margin-bottom:18px}
.card-header{padding:14px 18px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:13px;font-weight:700;color:white;font-family:'Sora',sans-serif}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;color:#6b7280;font-weight:normal;text-align:left;border-bottom:1px solid #1f2937;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:#0d1421}
td{padding:11px 14px;border-bottom:1px solid #0f1623;vertical-align:middle;color:#e0e0e0}
tr:last-child td{border-bottom:none}
tr:hover td{background:#151f2e}

/* Badges */
.badge{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block}
.b-free{background:#0f1f3d;color:#4d9de0}
.b-pro{background:#052e1c;color:#10b981}
.b-business{background:#2d1f00;color:#f59e0b}

/* Buttons */
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn-blue{background:#2f7cf6;color:#fff}
.btn-gray{background:#1f2937;color:#9ca3af;border:1px solid #374151}
.btn-sm{padding:4px 10px;font-size:11px}

/* Conf */
.conf-high{color:#ef4444;font-weight:700}
.conf-mid{color:#f59e0b;font-weight:700}

/* Empty */
.empty{color:#374151;text-align:center;padding:40px;font-size:13px}

/* Status */
.status-live{display:flex;align-items:center;gap:6px;font-size:12px;color:#10b981}
.status-offline{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280}
.dot{width:7px;height:7px;border-radius:50%}
.dot-live{background:#10b981;animation:pulse 2s infinite}
.dot-offline{background:#6b7280}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Upgrade banner */
.upgrade-banner{background:linear-gradient(135deg,#0f1f3d,#1a0a2d);border:1px solid #1f3a6e;border-radius:10px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.upgrade-banner h3{font-size:14px;color:white;margin-bottom:3px;font-family:'Sora',sans-serif}
.upgrade-banner p{font-size:12px;color:#6b7280}

/* Loading */
.loading{text-align:center;padding:60px;color:#374151;font-size:14px}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🛡</div>
    <div class="logo-text"><h2>Livestrym</h2><span>Live Protection</span></div>
  </div>
  <div class="user-box">
    <div class="user-avatar" id="user-avatar">?</div>
    <div>
      <div class="user-name" id="user-name">Loading...</div>
      <span class="user-tier" id="user-tier">free</span>
    </div>
    <div style="clear:both"></div>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item active" onclick="showPage('overview')" id="nav-overview"><span class="nav-icon">📊</span>Overview</a>
    <a class="nav-item" onclick="showPage('alerts')" id="nav-alerts"><span class="nav-icon">🚨</span>Alerts</a>
    <a class="nav-item" onclick="showPage('settings')" id="nav-settings"><span class="nav-icon">⚙️</span>Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a href="#" onclick="logout()" style="font-size:12px;color:#6b7280">Sign out</a>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Overview</div>
    <div id="stream-status" class="status-offline">
      <div class="dot dot-offline"></div>
      Checking...
    </div>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading your dashboard...</div>
  </div>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────────────
const token = localStorage.getItem('ls_token');
const user  = JSON.parse(localStorage.getItem('ls_user') || 'null');

if (!token || !user || token === 'null') {
  window.location.href = '/dashboard/login';
  throw new Error('Not authenticated');
}

function logout() {
  localStorage.removeItem('ls_token');
  localStorage.removeItem('ls_user');
  window.location.href = '/dashboard/login';
}

// ── Populate sidebar ──────────────────────────────────────────────────────────
if (user) {
  const initials = user.full_name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent = initials;
  document.getElementById('user-name').textContent   = user.full_name;
  document.getElementById('user-tier').textContent   = user.tier.toUpperCase();
}

// ── Load detections ───────────────────────────────────────────────────────────
async function loadDashboard() {
  try {
    const r    = await fetch(`/api/detections?token=${encodeURIComponent(token)}`);
    const data = await r.json();
    if (!r.ok) {
      if (r.status === 401) { logout(); return; }
      throw new Error(data.detail);
    }
    allDetections = data;
    renderOverview(allDetections);
  } catch (err) {
    document.getElementById('content').innerHTML =
      `<div class="loading">Error loading dashboard. Please refresh.</div>`;
  }
}

function renderDashboard(detections) {
  const total    = detections.length;
  const reported = detections.filter(d => d.reported).length;
  const high     = detections.filter(d => parseFloat(d.confidence_score || 0) >= 0.85).length;

  const upgradeBanner = user.tier === 'free' ? `
    <div class="upgrade-banner">
      <div>
        <h3>Upgrade to Pro or Business</h3>
        <p>Get more channels, team members, WhatsApp alerts and longer history.</p>
      </div>
      <a href="/pricing" class="btn btn-blue">Upgrade →</a>
    </div>` : '';

  let rows = '';
  if (detections.length === 0) {
    rows = '<tr><td colspan="6" class="empty">No rebroadcasts detected yet. Make sure your channel is being monitored.</td></tr>';
  } else {
    detections.forEach(d => {
      const score = parseFloat(d.confidence_score || 0);
      const cc    = score >= 0.85 ? 'conf-high' : 'conf-mid';
      const time  = new Date(d.detected_at).toLocaleString();
      rows += `<tr>
        <td>${d.channel_name || 'Unknown'}</td>
        <td><a href="${d.stream_url}" target="_blank" style="color:#4d9de0">${(d.stream_title || '').slice(0,45)}</a></td>
        <td style="text-align:center">${d.concurrent_viewers || '?'}</td>
        <td class="${cc}" style="text-align:center">${(score * 100).toFixed(0)}%</td>
        <td style="text-align:center">${d.reported ? '✅' : '—'}</td>
        <td>${time}</td>
        <td><a href="${d.stream_url}" target="_blank" class="btn btn-sm btn-gray">Open</a></td>
      </tr>`;
    });
  }

  document.getElementById('content').innerHTML = `
    <div class="page-title">Overview</div>
    <div class="page-sub">Welcome back, ${user.full_name.split(' ')[0]}</div>
    ${upgradeBanner}
    <div class="stats">
      <div class="stat">
        <div class="stat-icon">🚨</div>
        <div class="stat-num">${total}</div>
        <div class="stat-label">Total detections</div>
      </div>
      <div class="stat">
        <div class="stat-icon">🔴</div>
        <div class="stat-num">${high}</div>
        <div class="stat-label">High confidence (85%+)</div>
      </div>
      <div class="stat">
        <div class="stat-icon">✅</div>
        <div class="stat-num">${reported}</div>
        <div class="stat-label">Reported to YouTube</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>Rebroadcast Alerts</h3>
        <span style="font-size:12px;color:#6b7280">${total} total</span>
      </div>
      <table>
        <tr>
          <th>Channel</th>
          <th>Stream</th>
          <th>Viewers</th>
          <th>Match</th>
          <th>Reported</th>
          <th>Detected</th>
          <th></th>
        </tr>
        ${rows}
      </table>
    </div>`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadDashboard();

// ── Page navigation ───────────────────────────────────────────────────────────
let allDetections = [];

function showPage(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`nav-${page}`).classList.add('active');
  document.getElementById('topbar-title').textContent =
    page === 'overview' ? 'Overview' : page === 'alerts' ? 'Alerts' : 'Settings';

  if (page === 'overview')  renderOverview(allDetections);
  if (page === 'alerts')    renderAlerts(allDetections);
  if (page === 'settings')  renderSettings();
}

function renderOverview(detections) {
  const total    = detections.length;
  const high     = detections.filter(d => parseFloat(d.confidence_score || 0) >= 0.85).length;
  const reported = detections.filter(d => d.reported).length;

  const upgradeBanner = user.tier === 'free' ? `
    <div class="upgrade-banner">
      <div>
        <h3>Upgrade to Pro or Business</h3>
        <p>Get more channels, team members, WhatsApp alerts and longer history.</p>
      </div>
      <a href="#" class="btn btn-blue">Upgrade →</a>
    </div>` : '';

  const recent   = detections.slice(0, 5);
  let rows = buildRows(recent);

  document.getElementById('content').innerHTML = `
    <div class="page-title">Overview</div>
    <div class="page-sub">Welcome back, ${user.full_name.split(' ')[0]}</div>
    ${upgradeBanner}
    <div class="stats">
      <div class="stat"><div class="stat-icon">🚨</div><div class="stat-num">${total}</div><div class="stat-label">Total detections</div></div>
      <div class="stat"><div class="stat-icon">🔴</div><div class="stat-num">${high}</div><div class="stat-label">High confidence (85%+)</div></div>
      <div class="stat"><div class="stat-icon">✅</div><div class="stat-num">${reported}</div><div class="stat-label">Reported to YouTube</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Recent Alerts</h3><a onclick="showPage('alerts')" style="font-size:12px;cursor:pointer">View all →</a></div>
      <table><tr><th>Channel</th><th>Stream</th><th>Viewers</th><th>Match</th><th>Time</th><th></th></tr>${rows}</table>
    </div>`;
}

function renderAlerts(detections) {
  let rows = buildRows(detections);
  document.getElementById('content').innerHTML = `
    <div class="page-title">All Alerts</div>
    <div class="page-sub">${detections.length} total rebroadcasts detected</div>
    <div class="card">
      <div class="card-header"><h3>Rebroadcast Log</h3><span style="font-size:12px;color:#6b7280">${detections.length} total</span></div>
      <table><tr><th>Channel</th><th>Stream</th><th>Viewers</th><th>Match</th><th>Reported</th><th>Detected</th><th></th></tr>${rows}</table>
    </div>`;
}

function renderSettings() {
  document.getElementById('content').innerHTML = `
    <div class="page-title">Settings</div>
    <div class="page-sub">Manage your account and alert preferences</div>
    <div class="card">
      <div class="card-header"><h3>Account Details</h3></div>
      <div style="padding:20px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Full Name</div>
            <div style="font-size:14px;color:white">${user.full_name}</div>
          </div>
          <div>
            <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Email</div>
            <div style="font-size:14px;color:white">${user.email}</div>
          </div>
          <div>
            <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Organization</div>
            <div style="font-size:14px;color:white">${user.org_name}</div>
          </div>
          <div>
            <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Current Plan</div>
            <div style="font-size:14px"><span class="badge b-${user.tier}">${user.tier.toUpperCase()}</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-header"><h3>Telegram Alerts</h3></div>
      <div style="padding:20px;font-size:13px;color:#6b7280;line-height:1.7">
        <p>Telegram alerts are configured in your desktop app settings.</p>
        <p>To set up Telegram: open the Livestrym desktop app → Settings tab → enter your Bot Token and Chat ID.</p>
        <p style="margin-top:12px">Need help? Email us at <a href="mailto:hello@livestrym.io">hello@livestrym.io</a></p>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-header"><h3>Danger Zone</h3></div>
      <div style="padding:20px">
        <button onclick="logout()" class="btn" style="background:#2d0a0a;color:#ef4444;border:1px solid #7f1d1d">Sign out of all devices</button>
      </div>
    </div>`;
}

function buildRows(detections) {
  if (!detections.length) {
    return '<tr><td colspan="7" class="empty">No rebroadcasts detected yet.</td></tr>';
  }
  return detections.map(d => {
    const score = parseFloat(d.confidence_score || 0);
    const cc    = score >= 0.85 ? 'conf-high' : 'conf-mid';
    const time  = new Date(d.detected_at).toLocaleString();
    return `<tr>
      <td>${d.channel_name || 'Unknown'}</td>
      <td><a href="${d.stream_url}" target="_blank" style="color:#4d9de0">${(d.stream_title || '').slice(0,45)}</a></td>
      <td style="text-align:center">${d.concurrent_viewers || '?'}</td>
      <td class="${cc}" style="text-align:center">${(score * 100).toFixed(0)}%</td>
      <td style="text-align:center">${d.reported ? '✅' : '—'}</td>
      <td style="font-size:12px;color:#6b7280">${time}</td>
      <td><a href="${d.stream_url}" target="_blank" class="btn btn-sm btn-gray">Open</a></td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
