<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestrym — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#060a12;color:#e0e8ff;min-height:100vh;display:flex;flex-direction:column}
a{color:#6ba3ff;text-decoration:none}
nav{padding:0 6%;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(47,124,246,0.1);background:rgba(6,10,18,0.95)}
.nav-logo{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:white;display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo-icon{width:30px;height:30px;background:#2f7cf6;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:#0d1421;border:1px solid rgba(47,124,246,0.15);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 0 60px rgba(47,124,246,0.08)}
.card h1{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:white;margin-bottom:6px}
.card p{font-size:14px;color:#6b7a99;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#6b7a99;margin-bottom:6px}
.form-group input{width:100%;padding:11px 14px;background:#060a12;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e0e8ff;font-size:14px;font-family:'DM Sans',sans-serif;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:#2f7cf6}
.form-group input::placeholder{color:#3a4a62}
.btn-submit{width:100%;padding:13px;background:#2f7cf6;border:none;border-radius:8px;color:white;font-size:15px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:all .2s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover{background:#1a5fd4}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}
.alert-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
.alert-info{background:rgba(47,124,246,0.08);border:1px solid rgba(47,124,246,0.2);color:#93c5fd}
.card-footer{text-align:center;margin-top:20px;font-size:13px;color:#6b7a99}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">
    <div class="nav-logo-icon">🛡</div>
    Livestrym
  </a>
  <a href="/signup" style="font-size:13px;color:#6b7a99">No account? Sign up free</a>
</nav>
<div class="page">
  <div class="card">
    <h1>Welcome back</h1>
    <p>Sign in to your Livestrym account</p>
    <div id="alert-box"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@ministry.org" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">
        <span id="btn-text">Sign in →</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
    <div class="card-footer">
      Don't have an account? <a href="/signup">Sign up free</a>
    </div>
  </div>
</div>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submit-btn');
  const btnText  = document.getElementById('btn-text');
  const spinner  = document.getElementById('spinner');
  const alertBox = document.getElementById('alert-box');

  alertBox.innerHTML = '';
  btn.disabled = true;
  btnText.textContent = 'Signing in...';
  spinner.style.display = 'block';

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (!r.ok) {
      alertBox.innerHTML = `<div class="alert alert-error">${data.detail || 'Login failed. Please try again.'}</div>`;
      return;
    }
    // Store token and redirect to dashboard
    localStorage.setItem('ls_token', data.access_token);
    localStorage.setItem('ls_user', JSON.stringify(data.user));
    window.location.href = '/dashboard';
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">Network error. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Sign in →';
    spinner.style.display = 'none';
  }
}

// If already logged in redirect to dashboard
const existingToken = localStorage.getItem('ls_token');
if (existingToken && existingToken !== 'null') {
  window.location.href = '/dashboard';
}
</script>
</body>
</html>
