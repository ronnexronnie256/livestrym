# scanner/nixpacks.toml
# Place this file inside the scanner/ folder
# Tells Railway: use these system packages + this requirements.txt + this start command

[phases.setup]
nixPkgs = [
    "python313",
    "ffmpeg",
    "chromaprint",
]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python main.py"
