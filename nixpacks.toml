# ─────────────────────────────────────────────────────────────
# nixpacks.toml — API service (place at repo ROOT)
# Installs libpq system library so psycopg2-binary works
# ─────────────────────────────────────────────────────────────

[phases.setup]
nixPkgs = [
    "python313",
    "gcc",
    "postgresql_16",    # provides libpq system library
]

[phases.install]
cmds = [
    # Force binary version first before rest of requirements
    "pip install psycopg2-binary==2.9.9",
    "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
