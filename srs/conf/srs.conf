# ─────────────────────────────────────────────────────────────
# Livestrym SRS Configuration — Production
# ossrs/srs:6
# Every directive annotated. Do not use :latest tag.
# ─────────────────────────────────────────────────────────────

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

# HTTP API — internal Railway network only, never public
http_api {
    enabled         on;
    listen          1985;
}

# HTTP Server — serves HLS segments to ARQ worker internally
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {

    # ── RTMPS SSL CONFIG ──────────────────────────────────────
    # SRS v6 enables RTMPS by adding an ssl block inside the vhost.
    # It automatically upgrades the global listen port (1935) to support TLS.
    ssl {
        enabled         on;
        # Using absolute paths to ensure SRS finds them regardless of working directory
        key             /usr/local/srs/conf/server.key;
        cert            /usr/local/srs/conf/server.crt;
    }

    # ── HTTP CALLBACKS ────────────────────────────────────────
    # SRS fires these synchronously — FastAPI must respond within 5s
    http_hooks {
        enabled         on;

        # on_publish: fires when encoder connects
        # FastAPI validates stream key — return {"code":0} to allow
        on_publish      http://api.railway.internal:8000/api/srs/on_publish;

        # on_unpublish: fires when encoder disconnects
        # FastAPI clears Redis session, rotates stream key
        on_unpublish    http://api.railway.internal:8000/api/srs/on_unpublish;

        # on_play: fires when a viewer starts watching
        on_play         http://api.railway.internal:8000/api/srs/on_play;

        # on_stop: fires when a viewer stops watching
        on_stop         http://api.railway.internal:8000/api/srs/on_stop;
    }

    # ── HLS OUTPUT ────────────────────────────────────────────
    # ARQ worker reads these segments for fingerprinting
    # Zero YouTube API calls — fingerprint from raw source
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    3;      # 3-second segments
        hls_window      12;     # 12-second sliding window (4 segments)
        hls_on_error    continue;
    }

    # ── FORWARDING ────────────────────────────────────────────
    # Dynamic forwarding configured at runtime via SRS HTTP API
    # when on_publish fires — see FastAPI configure_stream_forward()
    # Static forward example (reference only — do not uncomment):
    # forward {
    #     enabled     on;
    #     destination rtmp://a.rtmp.youtube.com/live2/<yt-key>;
    # }

    # ── SECURITY ─────────────────────────────────────────────
    security {
        enabled         on;
        # HLS playback restricted to internal Railway network only
        # Prevents pirates reading our own HLS directly
        deny            play    all;
        allow           play    127.0.0.1;
        allow           play    10.0.0.0/8;
    }

    # ── PERFORMANCE ───────────────────────────────────────────
    tcp_nodelay         on;
    min_latency         on;

    play {
        gop_cache       off;
        queue_length    10;
    }

    publish {
        mr              off;
    }
}