# ─────────────────────────────────────────────────────────────
# Livestrym SRS Configuration — Production (Plain RTMP)
# ossrs/srs:6
# ─────────────────────────────────────────────────────────────

# Change this from 1935 to 1934
listen              1934; 
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

# HTTP API — internal Railway network only
http_api {
    enabled         on;
    listen          1985;
}

# HTTP Server — serves HLS segments to ARQ worker internally
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # ── HTTP CALLBACKS ────────────────────────────────────────
http_hooks {
    enabled         off; # <--- CHANGE THIS TO OFF
    # on_publish      http://api.railway.internal:8000/api/srs/on_publish;
    # on_unpublish    http://api.railway.internal:8000/api/srs/on_unpublish;
    # on_play         http://api.railway.internal:8000/api/srs/on_play;
    # on_stop         http://api.railway.internal:8000/api/srs/on_stop;
}
    # ── HLS OUTPUT ────────────────────────────────────────────
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    3;
        hls_window      12;
        hls_on_error    continue;
    }

    # ── SECURITY ─────────────────────────────────────────────
        # ── SECURITY ─────────────────────────────────────────────
    security {
        enabled         on;
        
        # Allow publishing from the Railway TCP proxy and internal network
        allow           publish all;
        
        # Restrict playback to internal network only (prevents public HLS leeching)
        deny            play    all;
        allow           play    127.0.0.1;
        allow           play    10.0.0.0/8;
        allow           play    100.64.0.0/10; # Railway's internal proxy IP range
    }
    # ── PERFORMANCE ───────────────────────────────────────────
    tcp_nodelay         on;
    min_latency         on;

    play {
        gop_cache       off;
        queue_length    10;
    }

    publish {
        mr              off;
    }
}