# Load required modules
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

# RTMPS streaming proxy
stream {
    upstream srs_backend {
        server 127.0.0.1:1934;
    }

    server {
        listen 1935 ssl;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_pass srs_backend;
        proxy_timeout 300s;
    }
}

# HTTP server for HLS playback
http {
    server {
        listen 80;
        
        # Serve HLS files from SRS
        location /live/ {
            alias /usr/local/srs/objs/nginx/html/live/;
            
            # Add CORS headers for web players
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control no-cache;
        }
        
        # Health check endpoint
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}