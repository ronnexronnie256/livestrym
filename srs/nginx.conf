worker_processes auto;

# NGINX requires an events block even if we only use stream
events {
    worker_connections 1024;
}

stream {
    upstream srs_backend {
        # Point to SRS on the internal port we just set
        server 127.0.0.1:1934;
    }

    server {
        # Listen publicly on 1935 with SSL
        listen 1935 ssl;
        
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_pass srs_backend;
        proxy_timeout 300s;
    }
}