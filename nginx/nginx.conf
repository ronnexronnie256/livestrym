worker_processes auto;

stream {
    # Point this to your SRS service on Railway's internal network
    # IMPORTANT: Replace 'srs' with the exact name of your SRS service in Railway
    upstream srs_backend {
        server srs.railway.internal:1935;
    }

    server {
        # Listen for incoming RTMPS (encrypted) connections
        listen 1935 ssl;

        # TLS Configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # Enforce strong security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_handshake_timeout 10s;

        # Proxy the decrypted TCP stream to the internal SRS server
        proxy_pass srs_backend;
        
        # Optional: timeout settings
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }
}